<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Bamboo · 访问密钥</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1115;
    --surface: #14181d;
    --surface-2: #191e24;
    --border: #242b33;
    --text: #e9edf2;
    --muted: #8b96a4;
    --faint: #5f6a77;
    --accent: #7fd3a8;
    --accent-strong: #93dfb8;
    --on-accent: #0c1410;
    --danger: #ffb4b4;
    --error-bg: #241a1a;
    --error-border: #5c2f2f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .3);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f2f4f6;
      --border: #e3e7ec;
      --text: #1b2027;
      --muted: #5c6674;
      --faint: #8b95a3;
      --accent: #2f9e6e;
      --accent-strong: #268e61;
      --on-accent: #ffffff;
      --danger: #b23c3c;
      --error-bg: #fff5f5;
      --error-border: #f0cccc;
      --shadow: 0 10px 30px rgba(15, 23, 42, .10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  form {
    width: 100%;
    max-width: 400px;
    padding: 28px 28px 24px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .brand strong { color: var(--accent); font-weight: 650; letter-spacing: .16em; }
  h1 { margin: 10px 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  .error {
    margin: 0 0 14px;
    padding: 9px 12px;
    border: 1px solid var(--error-border);
    border-radius: 10px;
    background: var(--error-bg);
    color: var(--danger);
    font-size: 13px;
  }
  input {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color .12s ease;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    transition: background .12s ease;
  }
  button:hover { background: var(--accent-strong); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="off">
  <div class="brand"><strong>Bamboo</strong> · 网页控制</div>
  <h1>输入访问密钥</h1>
  <p>密钥可以在播放器「设置 → 网页控制」中查看或重新生成。</p>
  <!--login-error-->
  <input name="key" type="password" placeholder="访问密钥" autofocus required autocomplete="current-password" aria-label="访问密钥" />
  <button type="submit">进入控制面板</button>
</form>
</body>
</html>
